# 2. 建议补充的性能与安全响应头（放到站点的 server { } 块内即可生效）
#
#   gzip on;
#   gzip_types text/css application/javascript application/json image/svg+xml;
#   gzip_min_length 1024;
#
#   静态资源长缓存（版本号通过 style.min.css?v=20260918c 之类的查询串控制，
#   更新时只需改版本号，不需要 CDN 刷新）
#   location /css/  { expires 30d; add_header Cache-Control "public, immutable"; }
#   location /js/   { expires 30d; add_header Cache-Control "public, immutable"; }
#   location /images/ { expires 30d; add_header Cache-Control "public"; }
#
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
