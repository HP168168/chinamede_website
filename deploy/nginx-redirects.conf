# ============================================================
# 美迪时代教育官网 - Nginx 服务端配置片段
#
# 用法：
#   1. 把本文件放到服务器的 nginx 配置目录（如 /etc/nginx/conf.d/meidi-redirects.conf）
#      或在站点的 server { } 块内加一行：include /etc/nginx/conf.d/meidi-redirects.conf;
#   2. nginx -t 检查语法，nginx -s reload 生效
#   3. 验证：curl -I https://www.chinamede.com/courses.html  应返回 301 + Location: /courses/
#
# 说明：
#   站点根目录下遗留了一批带 .html 后缀的历史 URL（如 /courses.html）。
#   它们目前依赖页面内的 meta refresh + JS 跳转兜底，搜索引擎仍会爬行到、
#   并可能收录「正在跳转…」这个标题。这里用真正的服务端 301 接管，
#   权重直接传递到对应的规范 URL。$is_args$args 用于保留查询参数（如投放渠道参数）。
# ============================================================

# ---------- 1. 历史 .html 地址 → 规范 URL（永久重定向）----------
location = /brand.html            { return 301 https://www.chinamede.com/brand/$is_args$args; }
location = /business.html         { return 301 https://www.chinamede.com/business/$is_args$args; }
location = /contact.html          { return 301 https://www.chinamede.com/contact/$is_args$args; }
location = /courses.html          { return 301 https://www.chinamede.com/courses/$is_args$args; }
location = /enroll.html           { return 301 https://www.chinamede.com/enroll/$is_args$args; }
location = /faq.html              { return 301 https://www.chinamede.com/faq/$is_args$args; }
location = /guide-geo.html        { return 301 https://www.chinamede.com/knowledge/guide-geo/$is_args$args; }
location = /guide-newmedia.html   { return 301 https://www.chinamede.com/knowledge/guide-newmedia/$is_args$args; }
location = /guide-shortvideo.html { return 301 https://www.chinamede.com/knowledge/guide-shortvideo/$is_args$args; }
location = /industry.html         { return 301 https://www.chinamede.com/industry/$is_args$args; }
location = /knowledge.html        { return 301 https://www.chinamede.com/knowledge/$is_args$args; }
# 知识百科三篇指南：早期位于 /knowledge/ 下的 .html 文件，同样收敛到目录形式
location = /knowledge/guide-geo.html        { return 301 https://www.chinamede.com/knowledge/guide-geo/$is_args$args; }
location = /knowledge/guide-newmedia.html   { return 301 https://www.chinamede.com/knowledge/guide-newmedia/$is_args$args; }
location = /knowledge/guide-shortvideo.html { return 301 https://www.chinamede.com/knowledge/guide-shortvideo/$is_args$args; }
location = /news.html             { return 301 https://www.chinamede.com/news/$is_args$args; }
location = /students.html         { return 301 https://www.chinamede.com/students/$is_args$args; }
location = /teachers.html         { return 301 https://www.chinamede.com/teachers/$is_args$args; }

# 目录索引统一指向 index.html（站点 server 块里通常已配置 try_files，若已有则不要重复加）
# location / {
#     try_files $uri $uri/index.html $uri.html =404;
# }

