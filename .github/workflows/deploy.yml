name: Deploy to GitHub Pages

# Astro 是 SSG：必须先在 CI 里构建出 dist/，再发布静态产物。
# 之前仓库的 Pages 走的是「Deploy from a branch + Jekyll」，
# 但 main 根目录现在是 Astro 源码（无根 index.html），Jekyll 构建必然失败。
# 因此改用官方 Pages Actions 流程发布 dist/。

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Strapi 后台发布内容后由 Webhook 触发（POST /repos/{owner}/{repo}/dispatches，event_type = cms-publish）
  repository_dispatch:
    types: [cms-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          # 后台地址与只读 API Token：在仓库 Secrets 中配置；
          # 未配置时取数层自动降级读 src/data/__snapshot__ 快照，本地与云端都能构建。
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
          # 需要覆盖站点基准地址（canonical / OG / JSON-LD / llms.txt）时设置
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
